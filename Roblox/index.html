<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
        }

        #ui h2 {
            margin-bottom: 10px;
            color: #00a8ff;
        }

        #ui p {
            margin: 5px 0;
            line-height: 1.6;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }

        #controls h3 {
            margin-bottom: 10px;
            color: #00ff00;
        }

        button {
            background-color: #00a8ff;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background-color: #0088cc;
        }

        #partProps {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        input[type="text"], input[type="number"] {
            background-color: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 5px;
            border-radius: 3px;
            margin: 5px 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🎮 Roblox Clone</h2>
        <p><strong>FPS:</strong> <span id="fps">60</span></p>
        <p><strong>Parts:</strong> <span id="partCount">0</span></p>
        <p id="buildMode" style="color: #ffff00;"><strong>Mode:</strong> Play</p>
    </div>

    <div id="controls">
        <h3>Controls</h3>
        <p><strong>Movement:</strong> WASD</p>
        <p><strong>Look:</strong> Mouse</p>
        <p><strong>Jump:</strong> Space</p>
        <p><strong>Build:</strong> B (toggle)</p>
        <p><strong>Place Part:</strong> Left Click</p>
        <p><strong>Delete:</strong> Right Click</p>
        <p><strong>Rotate:</strong> R/T</p>
        <hr style="margin: 10px 0; border: none; border-top: 1px solid #555;">
        <p><strong>Part Properties:</strong></p>
        <div id="partProps">
            <label>Color:</label>
            <input type="text" id="colorInput" placeholder="#ff0000" value="#ff0000">
            <label>Size (1-10):</label>
            <input type="range" id="sizeSlider" min="1" max="10" value="2">
            <button onclick="window.gameEngine.resetCamera()">Reset View</button>
        </div>
    </div>

    <script type="module" src="/src/index.js"></script>
</body>
</html>
