<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grid Study</title>
    <style>
        :root{
            --cols: 4;
            --gap: 12px;
            --item-h: 100px;
            --accent:#0b74de;
            --bg:#0f1720;
            --card:#0b1220;
            --muted:#94a3b8;
        }
        html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;smooth-font-scaling:antialiased;background:linear-gradient(180deg,#071023 0%,#071522 100%);color:#e6eef8}
        .wrap{max-width:1100px;margin:28px auto;padding:20px}
        header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
        h1{font-size:20px;margin:0;color:var(--accent)}
        .controls{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
        .controls label{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
        input[type=range]{width:160px}
        .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
        .grid{
            display:grid;
            grid-template-columns:repeat(var(--cols),1fr);
            gap:var(--gap);
            margin-top:14px;
            transition:all .22s ease;
        }
        .item{
            height:var(--item-h);
            background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.06));
            border-radius:8px;
            display:flex;align-items:center;justify-content:center;
            color:#dbeafe;font-weight:600;box-shadow:0 6px 18px rgba(2,6,23,0.6);
            border:1px solid rgba(255,255,255,0.03);
            font-size:14px;
        }
        .overlay{
            pointer-events:none;
            position:relative;
        }
        .show-grid .item{outline:1px dashed rgba(255,255,255,0.06) inset}
        .meta{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
        @media (max-width:700px){
            :root{--cols:2}
            input[type=range]{width:120px}
            .controls{flex-wrap:wrap}
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Grid Study • Interactive CSS Grid</h1>
            <div class="controls card">
                <label>Columns: <output id="colsOut">4</output>
                    <input id="cols" type="range" min="1" max="8" value="4" />
                </label>
                <label>Gap: <output id="gapOut">12px</output>
                    <input id="gap" type="range" min="0" max="48" value="12" />
                </label>
                <label style="align-items:center"><input id="toggle" type="checkbox" /> Show guides</label>
            </div>
        </header>

        <section class="card overlay" id="stage">
            <div class="grid" id="grid">
                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>
                <div class="item">4</div>
                <div class="item">5</div>
                <div class="item">6</div>
                <div class="item">7</div>
                <div class="item">8</div>
                <div class="item">9</div>
                <div class="item">10</div>
                <div class="item">11</div>
                <div class="item">12</div>
            </div>

            <div class="meta">
                <div>Tip: Resize the window to see auto-placement behavior.</div>
                <div id="debug" style="margin-left:auto"></div>
            </div>
        </section>
    </div>

    <script>
        // Lightweight interactive controls for the demo
        const root = document.documentElement;
        const cols = document.getElementById('cols');
        const gap = document.getElementById('gap');
        const colsOut = document.getElementById('colsOut');
        const gapOut = document.getElementById('gapOut');
        const toggle = document.getElementById('toggle');
        const stage = document.getElementById('stage');
        const debug = document.getElementById('debug');

        function apply(){
            const c = cols.value;
            const g = gap.value + 'px';
            root.style.setProperty('--cols', c);
            root.style.setProperty('--gap', g);
            colsOut.textContent = c;
            gapOut.textContent = g;
            debug.textContent = `grid-template-columns: repeat(${c}, 1fr) • gap ${g}`;
        }

        cols.addEventListener('input', apply);
        gap.addEventListener('input', apply);
        toggle.addEventListener('change', () => {
            stage.classList.toggle('show-grid', toggle.checked);
        });

        // initialize
        apply();
    </script>
</body>
</html><!DOCTYPE html>
